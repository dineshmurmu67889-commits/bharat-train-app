
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharat Train - Asli Live</title>
<style>
body{font-family:Arial;background:#eef2ff;margin:0;padding:12px}
.card{background:white;border-radius:15px;padding:18px;max-width:460px;margin:auto}
h1{text-align:center;color:#1a237e;margin:0}
.sub{text-align:center;color:green;font-size:13px;font-weight:bold}
label{font-weight:bold;display:block;margin-top:12px}
input{width:100%;padding:13px;border:2px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box;margin-top:5px}
button{width:100%;padding:14px;background:#ff5722;color:white;border:none;border-radius:10px;font-size:17px;margin-top:15px;font-weight:bold}
.train{border-left:5px solid #1a237e;background:#f9f9f9;padding:12px;border-radius:10px;margin-top:12px}
.price{float:right;color:green;font-weight:bold}
#status{text-align:center;margin-top:10px;color:#555}
</style>
</head>
<body>
<div class="card">
<h1>🚂 Bharat Train</h1>
<div class="sub" id="live">Backend se jud raha hai...</div>
<label>From</label><input id="from" value="Howrah">
<label>To</label><input id="to" value="Delhi">
<label>Date</label><input id="date" type="date" value="2026-11-15">
<label>Train / PNR</label><input id="trainNo" placeholder="Ex: 12301">
<button onclick="search()">🔍 TRAIN DHUNDO - ASLI DATA</button>
<div id="status"></div><div id="list"></div>
</div>
<script>
const BACKEND="https://bharat-train-backend.onrender.com";
async function checkLive(){
 try{let r=await fetch(BACKEND+"/");let t=await r.text();
 document.getElementById('live').innerText="✅ Backend LIVE Hai: "+t.substring(0,40);
 }catch(e){document.getElementById('live').innerText="❌ Backend se jud nahi paya";}
}
checkLive();
async function search(){
 let from=document.getElementById('from').value.trim();
 let to=document.getElementById('to').value.trim();
 let date=document.getElementById('date').value;
 let trainNo=document.getElementById('trainNo').value.trim();
 let list=document.getElementById('list');
 let status=document.getElementById('status');
 list.innerHTML="";status.innerText="Backend se asli data la rahe hai... ⏳";
 let urls=[];
 if(trainNo) urls.push(BACKEND+"/api/train/"+trainNo);
 urls.push(BACKEND+"/api/trains?from="+encodeURIComponent(from)+"&to="+encodeURIComponent(to)+"&date="+date);
 urls.push(BACKEND+"/api/search?from="+encodeURIComponent(from)+"&to="+encodeURIComponent(to));
 urls.push(BACKEND+"/api/trains");
 let got=null;
 for(let u of urls){try{let r=await fetch(u);if(r.ok){got=await r.json();break;}}catch(e){}}
 if(!got){status.innerText="⚠️ Backend LIVE hai, lekin usme Train dhundne wala API abhi nahi hai. Screenshot bhejo, Backend fix kar dunga.";return;}
 status.innerText="✅ Backend se jawab mil gaya:";
 let trains=got.trains||got.data||got.results||(Array.isArray(got)?got:[got]);
 if(!trains.length){list.innerHTML="<p>Koi train nahi mili</p>";return;}
 trains.forEach(t=>{
  let name=t.name||t.trainName||t.train_name||"Train";
  let no=t.number||t.trainNumber||t.train_no||"";
  let price=t.price||t.fare||"";
  list.innerHTML+=`<div class="train"><b>${no} ${name}</b><span class="price">₹${price}</span><br>${t.from||from} → ${t.to||to}<br>${t.departure||t.time||""} • ${t.status||"Live"}</div>`;
 });
}
</script>
</body>
</html>
